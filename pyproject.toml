[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "arm-vla"
version = "0.1.0"
description = "ACT imitation pipeline for Isaac Lab manipulation tasks (UR5 + parallel-jaw gripper, single-task per checkpoint)."
requires-python = ">=3.12"
readme = "README.md"

# torch is installed separately from NVIDIA's index; see README for the
# platform-specific wheel command.
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "h5py>=3.10",
]

[project.optional-dependencies]
# Training-side deps. Installed into the local training venv.
ml = [
    "torchvision>=0.18",  # ResNet18 backbone for the ACT image encoder
]

# Eval-side deps. Installed into Isaac Lab's python.
sim = [
    "h5py>=3.10",
    "torchvision>=0.18",
    "imageio[ffmpeg]>=2.34",
]

dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arm_vla"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: line length handled by formatter, not linter.
# B008: fires on Isaac Lab's declarative `SceneEntityCfg(...)` / `EventTerm(...)`
#       field defaults — idiomatic for configclass-based envs.
ignore = ["E501", "B008"]

[tool.ruff.lint.pydocstyle]
# If/when D-rules are enabled selectively, use Google-style docstrings.
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
