[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "arm-vla"
version = "0.1.0"
description = "OpenVLA fine-tuning pipeline for UR10 pick-and-place tasks in Isaac Lab."
requires-python = ">=3.10"
readme = "README.md"

# torch is installed separately from NVIDIA's index; see README for the
# platform-specific wheel command.
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "h5py>=3.10",
    "draccus>=0.8",
]

[project.optional-dependencies]
ml = [
    # OpenVLA is pinned to transformers==4.40.1 / timm<1.0. The runtime
    # patches in eval/rollout.py + eval/zeroshot.py let it work with newer
    # transformers, but timm must stay <1.0.
    "transformers>=4.40,<4.58",
    "accelerate>=1.0",
    "peft>=0.13",
    "datasets>=3.0",
    "bitsandbytes>=0.44 ; platform_machine == 'x86_64'",
    "tensorflow>=2.15",
    "tensorflow-datasets>=4.9",
    "tensorflow-graphics",
    "dlimp @ git+https://github.com/kvablack/dlimp@main",
    "wandb>=0.18",
    "timm>=0.9.10,<1.0",
    "einops>=0.8",
    "rich>=13",
    "openvla @ git+https://github.com/openvla/openvla@main",
]

sim = [
    "h5py>=3.10",
    "tensorflow-datasets>=4.9",
    "transformers>=4.40,<4.58",
    "peft>=0.13",
    "accelerate>=1.0",
    "timm>=0.9.10,<1.0",
    "pillow>=10",
    "imageio[ffmpeg]>=2.34",
]

dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arm_vla"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: line length handled by formatter, not linter.
# B008: fires on Isaac Lab's declarative `SceneEntityCfg(...)` / `EventTerm(...)`
#       field defaults — idiomatic for configclass-based envs.
ignore = ["E501", "B008"]

[tool.ruff.lint.pydocstyle]
# If/when D-rules are enabled selectively, use Google-style docstrings.
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
