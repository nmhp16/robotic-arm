[project]
name = "arm-vla"
version = "0.1.0"
description = "OpenVLA fine-tuning pipeline for a UR10 pick-and-place task in Isaac Lab."
requires-python = ">=3.10"
readme = "README.md"

# torch is installed separately from NVIDIA's index; see README for the
# platform-specific wheel command.
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "h5py>=3.10",
    "draccus>=0.8",
]

[project.optional-dependencies]
ml = [
    "transformers>=4.46,<4.50",
    "accelerate>=1.0",
    "peft>=0.13",
    "datasets>=3.0",
    "bitsandbytes>=0.44 ; platform_machine == 'x86_64'",
    "tensorflow>=2.15",
    "tensorflow-datasets>=4.9",
    "tensorflow-graphics",
    "dlimp @ git+https://github.com/kvablack/dlimp@main",
    "wandb>=0.18",
    "timm>=1.0",
    "einops>=0.8",
    "rich>=13",
    "openvla @ git+https://github.com/openvla/openvla@main",
]

sim = [
    "h5py>=3.10",
    "tensorflow-datasets>=4.9",
    "transformers>=4.46,<4.50",
    "peft>=0.13",
    "pillow>=10",
    "imageio[ffmpeg]>=2.34",
]

dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arm_vla"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
