model:
  vla_path: openvla/openvla-7b
  # flash-attn does not build on aarch64; sdpa is the portable default.
  attn_implementation: sdpa

data:
  data_root_dir: data/rlds
  dataset_name: ur5_pick_place
  image_aug: true
  shuffle_buffer_size: 10000
  action_normalization: q99

lora:
  rank: 32
  alpha: 16
  dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  batch_size: 8
  grad_accum: 2
  learning_rate: 5.0e-4
  lr_scheduler: cosine
  warmup_steps: 100
  max_steps: 50000
  save_every: 2500
  log_every: 20
  bf16: true

wandb:
  enabled: true
  project: arm-vla
  mode: offline
