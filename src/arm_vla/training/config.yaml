# Single config for the full ACT training run.
# Most users only need to tune: data.hdf5_path, training.max_steps, training.batch_size.

data:
  # HDF5 produced by `./scripts/teleop.sh` (raw) and optionally augmented
  # via `./scripts/mimic.sh` (data/augmented/demos.hdf5). Raw works fine
  # too — set hdf5_path to whichever you have.
  hdf5_path: data/raw/demos.hdf5
  camera_keys:
    - table_cam
    - wrist_cam

policy:
  chunk_size: 50         # how many actions to predict per forward pass (and to replay open-loop)
  hidden_dim: 256
  n_heads: 8
  n_encoder_layers: 4
  n_decoder_layers: 1
  dim_feedforward: 1024
  dropout: 0.1
  pretrained_backbone: true   # ImageNet-init the per-camera ResNet18s

training:
  max_steps: 50000
  batch_size: 64
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 500
  log_every: 50
  save_every: 5000
  num_workers: 4
