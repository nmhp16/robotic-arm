# Pick a leaf-plant OUT of a vial sitting on the table and place it on
# a tray off to the side. Reverse direction of put_plant_in_vial.
#
# Tweezer is held at midshaft (mounted on the SCARA wrist). Workspace
# is on the table top (z=0) — the SCARA's TCP only reaches z=~0.065 to
# z=~0.265 with the long tweezer, so the plant + vial can't sit on a
# tall pedestal.
#
# Vial collision is disabled (cosmetic only); plant rests on the table
# directly. Visually the plant appears inside the vial because the vial
# wraps around it, but PhysX-wise plant interacts only with the table.
#
# Uses the default _runtime archetype (HOVER -> DESCEND -> GRASP -> LIFT
# -> MOVE -> PLACE -> RELEASE). Grasp point is on the visible stem
# above the leaves so the tweezer doesn't fight foliage on descent.
#
# To run:
#   ./scripts/oracle.sh   --task pick_plant_out_of_vial --num-demos 15
#   ./scripts/annotate.sh --task pick_plant_out_of_vial
#   ./scripts/mimic.sh    --task pick_plant_out_of_vial --num-demos 500
#   ./scripts/train.sh    --task pick_plant_out_of_vial
#   ./scripts/eval.sh     --task pick_plant_out_of_vial

task:
  name: pick_plant_out_of_vial
  instruction: pick the plant out of the vial and place it on the tray
  gym_id: Isaac-PickPlantOutOfVial-T3-IK-Rel-v0
  mimic_gym_id: Isaac-PickPlantOutOfVial-T3-IK-Rel-Mimic-v0

# --- Robot ------------------------------------------------------------------
robot:
  type: t3_401_tweezer
  arm_joints: [joint_1, joint_2, joint_3, joint_4]
  ee_body: tool0_aligned
  tcp_z_offset: 0.05                          # 50 mm short tweezer (see
                                              # t3_401_tweezer.urdf for why)
  arm_joint_jitter_std: 0.02
  gripper_joints: [finger_left_joint, finger_right_joint]
  gripper_open_m: 0.0
  gripper_close_m: 0.005
  gripper_closed_threshold: 0.0025
  gripper_driver_joint: finger_left_joint
  # Init pose: home (all-zeros) — TCP ends up at world (~0.4, 0, 0.22),
  # 9 cm horizontal from the vial center and looking down. This is the
  # same "above the workspace" start that gave put_plant_back its 98%
  # vision run; the wrist-cam sees the vial+plant from above with
  # enough scene context for the CNN to extract a learning signal.
  #
  # An earlier "hover directly above vial" init pose
  # (joint_1=0.554, joint_2=-1.381, joint_3=0.08) made the wrist-cam
  # frame near-monochrome dark at reset — the CNN had no signal and
  # 495 PPO iters showed zero progress. If you want a closer start,
  # leave joint_3 at ~0 (TCP high) so the wrist-cam keeps a wide view
  # of the workspace.
  # init_joint_pos: {}

# --- Scene objects ----------------------------------------------------------
# vial: kinematic, sits on the table directly. Collision disabled so
#   plant can spawn "inside" without being ejected.
# plant: spawned with body z ~= 0.05 (settles on table). Visually the
#   stem comes up out of the vial mouth, leaves are above the rim.
# tray: cuboid pad off to the +y side, where the policy is supposed to
#   put the plant down.
objects:
  vial:
    role: distractor
    type: usd
    usd_path: local:assets/wide_vial/wide_vial.usd
    scale: [1.0, 1.0, 1.0]
    kinematic: true
    collision: false                          # cosmetic; plant interacts with table
    # Fixed spawn (no xy randomization) for vision-PPO cold start. With
    # randomized 2cm × 2cm spawns the CNN had to learn translation
    # invariance from scratch; fixing the position lets the policy
    # memorize a single trajectory first. Re-add randomization (and
    # train DR + jitter) once the base policy is converged.
    spawn:
      x: [0.31, 0.31]
      y: [-0.01, -0.01]
      z: [0.035, 0.035]                       # vial centroid -> base z=0, top z=0.07
      yaw: [0.0, 0.0]
  plant:
    role: pickable
    type: usd
    usd_path: local:assets/leaf_plant/leaf_plant.usd
    scale: [1.0, 1.0, 1.0]
    friction:                                 # high friction so tweezer pinch holds
      static: 3.0
      dynamic: 2.5
      restitution: 0.0
    # Fixed spawn — see vial comment above.
    spawn:
      x: [0.31, 0.31]
      y: [-0.01, -0.01]
      z: [0.10, 0.10]                         # spawn 10 cm above table; settles around 0.06
      yaw: [0.0, 0.0]
  tray:
    # Vestigial — required for the YAML schema but unused: oracle is in
    # pick-and-lift-only mode (see oracle.terminate_after_lift below).
    # Kept as a tiny pad off-screen so it doesn't visually clutter the
    # scene. Once the env builder accepts target=None we can drop this.
    role: target
    type: cuboid
    size: [0.02, 0.02, 0.001]
    mass: 0.001
    color: [0.30, 0.40, 0.55]
    kinematic: true
    friction:
      static: 1.0
      dynamic: 0.8
      restitution: 0.0
    spawn:
      x: [0.10, 0.10]
      y: [0.30, 0.30]
      z: [0.0005, 0.0005]
      yaw: [0.0, 0.0]

# --- Cameras ----------------------------------------------------------------
cameras:
  table_cam:
    pos: [1.0, 0.0, 0.8]
    rot: [0.35355, -0.61237, -0.61237, 0.35355]
    focal_length: 18.0
    horizontal_aperture: 20.955
    clipping_range: [0.1, 4.0]
  wrist_cam:
    parent: tool0_aligned
    # FIX 2026-05-19: previous pos z=0.18 placed the wrist_cam INSIDE
    # link_4's housing — every frame rendered gray/black and the CNN
    # actor had no learnable signal (495-iter run on 2026-05-19 stuck
    # at 0.7% success, mean reward -0.13, action_std rising). New mount
    # mirrors the put_plant_back fix: 5 cm SIDEWAYS in +X (clear of the
    # housing), at z=0 (same height as the tool flange), looking DOWN
    # +Z toward the workspace via identity rot. See
    # memory/ppo_vision_breakthrough.md.
    pos: [0.05, 0.0, 0.0]
    rot: [1.0, 0.0, 0.0, 0.0]
    focal_length: 14.0
    horizontal_aperture: 20.955
    clipping_range: [0.01, 2.0]
    depth: true

# --- Success + grasp-check terms -------------------------------------------
success:
  type: object_on_target
  object: plant
  target: tray
  xy_threshold: 0.05
  height_threshold: 0.10
grasp_check:
  type: object_grasped
  object: plant
  diff_threshold: 0.04

# --- Scripted oracle (state machine) ---------------------------------------
# Pick-and-lift-only sequence: HOVER -> DESCEND -> GRASP -> LIFT -> done.
# No MOVE/PLACE/RELEASE — terminate_after_lift makes the oracle declare
# success when LIFT reaches lift_height. The tray is vestigial (kept for
# YAML schema reasons) and never visited.
oracle:
  hover_height: 0.10                          # tcp at plant.z + 0.10 = ~0.14
                                              # (well inside TCP max 0.18 so the
                                              # IK has clear margin to converge;
                                              # 0.13 was right at the J3=0 limit
                                              # and stalled half the episodes)
  grasp_z_offset: 0.025                       # tcp at plant.z + 0.025 = ~0.07
                                              # inside upper stem; well within
                                              # TCP range [0.03, 0.18]
  lift_height: 0.16                           # under TCP max 0.18; clears the
                                              # vial top (z=0.105) with margin
  place_z_offset: 0.0
  max_dxy: 0.04
  max_dz: 0.02                                # slow descent rate. With 0.05
                                              # the IK target jumped 5 cm per
                                              # env step, the actuator fell
                                              # behind and the joint stalled
                                              # mid-DESCEND. 2 cm/step lets the
                                              # actuator stay close to target.
  xy_reach_tol: 0.004                         # tight: stem is 4 mm dia; tweezer pinches
                                              # the centerline so TCP must align within
                                              # ~ stem radius for the close to grip
  z_reach_tol: 0.015
  z_reach_tol_tight: 0.012
  grasp_hold_steps: 18
  release_hold_steps: 5
  max_steps_per_episode: 300
  max_episode_attempts_per_demo: 5
  terminate_after_lift: true                  # ends the demo after the LIFT phase

# --- Mimic augmentation ----------------------------------------------------
mimic:
  name: pick_plant_out_of_vial_mimic_D0
  generation_num_trials: 10
  max_num_failures: 25
  seed: 1
  subtasks:
    - object: plant
      signal: grasp
      offset_range: [10, 20]
      action_noise: 0.03
      num_interpolation_steps: 5
      description: Grasp the plant in the vial
      next_description: Place the plant on the tray
    - object: tray
      signal: null
      offset_range: [0, 0]
      action_noise: 0.03
      num_interpolation_steps: 5
      description: Place the plant on the tray

# --- RL fine-tune (factored pick-only) -------------------------------------
# Mirror of put_plant_back's RL block. Vial pose is fixed at task start, so
# RL only learns the precision pick-and-lift; everything past LIFT is
# scripted (or simply not modeled — terminate_after_lift).
#
# success_termination=lifted with min_stable_steps=5 blocks the 1-frame
# teleport exploit that the kinematic_attach env is vulnerable to (see
# memory/stable-lift-termination).
rewards:
  approach_pickable: 5.0         # bumped 1.0 → 5.0 for asymmetric vision
                                 # PPO. The CNN actor has no privileged
                                 # plant pose; with weight=1.0 the dense
                                 # approach signal is too weak to overcome
                                 # action_l2_penalty before PPO collapses
                                 # action_std → ~0.1 (do-nothing minimum).
                                 # Verified: 108-iter run on 2026-05-19
                                 # with weight=1.0 collapsed to std=0.14,
                                 # success=0.
  approach_target: 0.0           # transport is scripted (not RL-learned)
  grasp_bonus: 1.0               # +1/step when gripper closed AND TCP
                                 # within 3cm of plant. Rebalanced from
                                 # 2.0 (v7) because policy camped at
                                 # the grasp zone: with weight=2 the
                                 # camping reward (40/ep) beat the
                                 # success path (29/ep), so PPO never
                                 # chose to lift. Halving brings
                                 # camping down to 20/ep, well below
                                 # the boosted success path (77.5/ep).
  lift_bonus: 10.0               # 2× v7. Bumps the per-step lift_hold
                                 # progress to make stable lift
                                 # meaningfully more rewarding than
                                 # camping. Wired to
                                 # reward_lift_hold_progress in lifted
                                 # mode — (counter+1)*weight per step
                                 # while holding.
  success_bonus: 1000.0          # 2× v7. One-shot terminal bonus on
                                 # stable-lift success
                                 # (reward_terminal_stable_lift). With
                                 # the boost the terminal contribution
                                 # is ~50 of episode reward — strongly
                                 # dominant over the rebalanced
                                 # camping reward (~20).
  action_l2_penalty: -0.0001     # reduced 10× from -0.001. Same reason:
                                 # don't dominate the dense approach
                                 # reward during the exploration phase.
  lift_height: 0.10              # 10 cm above plant z; clears the vial rim
  lift_stable_steps: 5           # 5 consecutive steps above threshold
                                 # required for "success" — blocks 1-frame
                                 # kin_attach teleport exploit
  success_termination: lifted    # episode ends on grasp+lift

# --- Data paths + checkpoint locations -------------------------------------
data:
  raw_path: data/raw/pick_plant_out_of_vial/demos.hdf5
  annotated_path: data/annotated/pick_plant_out_of_vial/demos.hdf5
  augmented_path: data/augmented/pick_plant_out_of_vial/demos.hdf5
  hdf5_path: data/raw/pick_plant_out_of_vial/demos.hdf5

training:
  output_dir: checkpoints/pick_plant_out_of_vial

eval:
  checkpoint: checkpoints/pick_plant_out_of_vial/final
