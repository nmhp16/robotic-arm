# Pick the plant OUT of the jar and place it on the holding tray.
#
# Phase 1 of the two-phase plant-jar task. Uses the default _runtime
# archetype (hover -> descend -> grasp -> lift -> move -> place -> release)
# because extraction matches it cleanly: the plant centroid is below the
# jar opening, but with grasp_z_offset>0 we grasp the stem at a height
# that's already above the jar opening, so no orientation control is
# needed during descent.
#
# To run:
#   ./scripts/oracle.sh   --task pick_plant_out --num-demos 15
#   ./scripts/annotate.sh --task pick_plant_out
#   ./scripts/mimic.sh    --task pick_plant_out --num-demos 500
#   ./scripts/train.sh    --task pick_plant_out
#   ./scripts/eval.sh     --task pick_plant_out

task:
  name: pick_plant_out
  instruction: pick the plant out of the jar and place it on the tray
  gym_id: Isaac-PickPlantOut-T3-IK-Rel-v0
  mimic_gym_id: Isaac-PickPlantOut-T3-IK-Rel-Mimic-v0

# --- Robot ------------------------------------------------------------------
# Epson T3-401 SCARA: 4-axis (J1+J2 horizontal, J3 prismatic vertical, J4
# yaw). 400mm planar reach, ~200mm sim-stretched Z stroke. Joint names
# come from the URDF (joint_1..joint_4, finger_left/right_joint).
robot:
  type: t3_401_simple_gripper
  arm_joints: [joint_1, joint_2, joint_3, joint_4]
  ee_body: tool0_aligned
  tcp_z_offset: 0.08
  arm_joint_jitter_std: 0.02
  gripper_joints: [finger_left_joint, finger_right_joint]
  gripper_open_m: 0.0
  gripper_close_m: 0.04
  gripper_closed_threshold: 0.02
  gripper_driver_joint: finger_left_joint

# --- Scene objects ----------------------------------------------------------
# The plant is the pickable: a tall thin cuboid approximating a stem.
# Standing vertical, the stem extends from z=0 to z=0.15 (centroid at
# z=0.075). We grasp it 6cm above its centroid (TCP at z=0.135), well
# above the jar's nominal opening (top z=0.10 in put_plant_back.yaml).
#
# The "target" is a flat tray pad placed off to the side of the jar.
# Spawn ranges are tightened to fit the T3-401's 400mm reach envelope.
#
# Note: the actual jar mesh is not spawned in this task. The plant's
# initial pose is what would be inside the jar; the policy learns to
# lift straight up first (LIFT phase reaches lift_height before MOVE)
# which implicitly clears any jar that's there.
objects:
  plant:
    role: pickable
    type: cuboid
    size: [0.02, 0.02, 0.15]        # 2cm x 2cm cross-section, 15cm tall
    mass: 0.05
    color: [0.35, 0.20, 0.08]       # brown stem
    friction:
      static: 2.0
      dynamic: 1.8
      restitution: 0.0
    spawn:
      x: [0.28, 0.32]               # within T3-401 reach (ring 0.05-0.40)
      y: [-0.04, 0.04]
      z: [0.075, 0.075]             # centroid at 7.5cm (stem standing up)
      yaw: [-0.3, 0.3]
  tray:
    role: target
    type: usd
    usd_path: Props/Blocks/green_block.usd
    scale: [2.0, 2.0, 0.2]
    kinematic: true
    spawn:
      x: [0.24, 0.28]
      y: [0.16, 0.22]               # tray off to the +y side, away from jar
      z: [0.0103, 0.0103]
      yaw: [0.0, 0.0]

# --- Cameras ----------------------------------------------------------------
# table_cam re-aimed for T3-401's smaller reach (objects at x ~0.30 vs
# UR5's x ~0.55). Wrist cam unchanged.
cameras:
  table_cam:
    pos: [1.0, 0.0, 0.8]
    rot: [0.35355, -0.61237, -0.61237, 0.35355]
    focal_length: 18.0
    horizontal_aperture: 20.955
    clipping_range: [0.1, 4.0]
  wrist_cam:
    parent: tool0_aligned
    pos: [0.05, 0.0, 0.18]
    rot: [1.0, 0.0, 0.0, 0.0]
    focal_length: 14.0
    horizontal_aperture: 20.955
    clipping_range: [0.01, 2.0]
    depth: true

# --- Success + grasp-check terms -------------------------------------------
# success: plant is over the tray, gripper open. xy_threshold loose since
# the tray is large; height_threshold tight (must be near the pad, not
# 30cm above it).
success:
  type: object_on_target
  object: plant
  target: tray
  xy_threshold: 0.06
  height_threshold: 0.10        # plant is 15cm tall; centroid sits well above
                                # the small tray pad even when fully placed
grasp_check:
  type: object_grasped
  object: plant
  diff_threshold: 0.06

# --- Scripted oracle (state machine) ---------------------------------------
# Heights tuned for a 15cm-tall stem and the T3-401's EE workspace
# (vertical range ~0.08 to ~0.28 above the table at home J1=J2=0).
oracle:
  hover_height: 0.15            # 15cm above plant centroid -> tcp at z=0.225
  grasp_z_offset: 0.06          # grasp 6cm above plant centroid -> tcp at z=0.135
  lift_height: 0.26             # near max reach; clears 8cm jar with margin
  place_z_offset: 0.145         # release with plant bottom touching the tray
                                # (tray top ~ z=0.020 + plant half-len 0.075
                                #  = TCP at z=0.155 = target.z + 0.145)
  max_dxy: 0.05
  max_dz: 0.05
  xy_reach_tol: 0.020
  z_reach_tol: 0.015
  z_reach_tol_tight: 0.008
  grasp_hold_steps: 15
  release_hold_steps: 5
  max_steps_per_episode: 400
  max_episode_attempts_per_demo: 5

# --- Mimic augmentation ----------------------------------------------------
mimic:
  name: pick_plant_out_mimic_D0
  generation_num_trials: 10
  max_num_failures: 25
  seed: 1
  subtasks:
    - object: plant
      signal: grasp
      offset_range: [10, 20]
      action_noise: 0.03
      num_interpolation_steps: 5
      description: Grasp the plant stem
      next_description: Place the plant on the tray
    - object: tray
      signal: null
      offset_range: [0, 0]
      action_noise: 0.03
      num_interpolation_steps: 5
      description: Place the plant on the tray

# --- Data paths + checkpoint locations -------------------------------------
data:
  raw_path: data/raw/pick_plant_out/demos.hdf5
  annotated_path: data/annotated/pick_plant_out/demos.hdf5
  augmented_path: data/augmented/pick_plant_out/demos.hdf5
  hdf5_path: data/raw/pick_plant_out/demos.hdf5

training:
  output_dir: checkpoints/pick_plant_out

eval:
  checkpoint: checkpoints/pick_plant_out/final
