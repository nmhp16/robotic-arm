# Full task spec for pick_place. Everything the runtime needs to wire up
# the env, oracle, mimic config, and ACT trainer lives here. No Python
# required — copy this file to a new tasks/<your_task>/task.yaml, edit
# the fields, and run ./scripts/train.sh --task <your_task>.

task:
  name: pick_place
  instruction: put the blue cube on the green target
  # gym ids are auto-derived from `name` if omitted, but you can override here.
  gym_id: Isaac-PickPlace-UR5-IK-Rel-v0
  mimic_gym_id: Isaac-PickPlace-UR5-IK-Rel-Mimic-v0

# --- Robot ------------------------------------------------------------------
# Lookup key into the robot library (see arm_vla/tasks/_runtime/robot_cfg.py).
# tcp_z_offset = distance from tool0_aligned to TCP between fingertips.
# Gripper commands are joint position targets fed into BinaryJointPositionActionCfg.
robot:
  type: ur5_simple_gripper
  tcp_z_offset: 0.08
  arm_joint_jitter_std: 0.02
  gripper_joints: [finger_left_joint, finger_right_joint]
  gripper_open_m: 0.0
  gripper_close_m: 0.04
  gripper_closed_threshold: 0.02      # driver-joint position above this counts as closed
  gripper_driver_joint: finger_left_joint   # which joint to read for "is gripper closed?"

# --- Scene objects ----------------------------------------------------------
# The "pickable" object is what the gripper grasps; "target" is where it
# should end up. Spawn ranges are uniform-sampled at reset.
objects:
  cube:
    role: pickable
    type: cuboid
    size: [0.04, 0.04, 0.04]
    mass: 0.05
    color: [0.1, 0.3, 0.9]
    friction:
      static: 2.0
      dynamic: 1.8
      restitution: 0.0
    spawn:
      x: [0.40, 0.50]
      y: [-0.08, 0.08]
      z: [0.0403, 0.0403]
      yaw: [-0.5, 0.5]
  target:
    role: target
    type: usd
    usd_path: Props/Blocks/green_block.usd     # relative to ISAAC_NUCLEUS_DIR
    scale: [2.0, 2.0, 0.2]
    kinematic: true
    spawn:
      x: [0.55, 0.65]
      y: [-0.10, 0.10]
      z: [0.0103, 0.0103]
      yaw: [0.0, 0.0]

# --- Cameras ----------------------------------------------------------------
# `parent: tool0_aligned` mounts the camera on the wrist; otherwise it's
# spawned at the env origin. Output is always 224x224 RGB.
cameras:
  table_cam:
    pos: [1.4, 0.0, 1.0]
    rot: [0.35355, -0.61237, -0.61237, 0.35355]
    focal_length: 18.0
    horizontal_aperture: 20.955
    clipping_range: [0.1, 4.0]
  wrist_cam:
    parent: tool0_aligned
    pos: [0.05, 0.0, 0.18]
    rot: [1.0, 0.0, 0.0, 0.0]
    focal_length: 14.0
    horizontal_aperture: 20.955
    clipping_range: [0.01, 2.0]
    depth: true                        # also output distance_to_image_plane

# --- Success + grasp-check terms -------------------------------------------
# `object_on_target` fires when `object` is within (xy_threshold, height_threshold)
# of `target` AND the gripper is open. Used as both a termination and a
# subtask signal (mimic uses `grasp` for the first subtask boundary).
success:
  type: object_on_target
  object: cube
  target: target
  xy_threshold: 0.05
  height_threshold: 0.06
grasp_check:
  type: object_grasped
  object: cube
  diff_threshold: 0.06

# --- Scripted oracle (state machine) ---------------------------------------
# Heights in meters; the state machine is hover→descend→grasp→lift→move→place→release
# and is implemented in arm_vla/tasks/_runtime/oracle.py — these knobs tune
# the trajectory.
oracle:
  hover_height: 0.15            # m above pickable centroid before descent
  grasp_z_offset: 0.0           # m relative to pickable centroid at grasp
  lift_height: 0.25             # m above table during transport
  place_z_offset: 0.035         # m above target pad centroid at release
  max_dxy: 0.05                 # per-step xy clamp (matches IK-rel scale)
  max_dz: 0.05                  # per-step z clamp
  xy_reach_tol: 0.020           # waypoint reached in xy (m)
  z_reach_tol: 0.015            # default z tolerance (m)
  z_reach_tol_tight: 0.008      # tightened for descend / place
  grasp_hold_steps: 15
  release_hold_steps: 5
  max_steps_per_episode: 400
  max_episode_attempts_per_demo: 5

# --- Mimic augmentation ----------------------------------------------------
# Subtask declarations consumed by isaaclab_mimic. The first subtask must
# declare a `signal` (see grasp_check above); the last typically uses null.
mimic:
  name: pick_place_mimic_D0
  generation_num_trials: 10
  max_num_failures: 25
  seed: 1
  subtasks:
    - object: cube
      signal: grasp
      offset_range: [10, 20]
      action_noise: 0.03
      num_interpolation_steps: 5
      description: Grasp the cube
      next_description: Place the cube on the target
    - object: target
      signal: null
      offset_range: [0, 0]
      action_noise: 0.03
      num_interpolation_steps: 5
      description: Place the cube on the target

# --- Data paths + checkpoint locations -------------------------------------
data:
  raw_path: data/raw/demos.hdf5
  annotated_path: data/annotated/demos.hdf5
  augmented_path: data/augmented/demos.hdf5
  hdf5_path: data/raw/demos.hdf5     # which file the trainer reads (raw or augmented)

training:
  output_dir: checkpoints/pick_place

eval:
  checkpoint: checkpoints/pick_place/final
