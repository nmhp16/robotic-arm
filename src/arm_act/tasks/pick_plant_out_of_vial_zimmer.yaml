# Pick a leaf-plant OUT of the vial using the Zimmer GEP2010IL parallel-jaw
# gripper with custom long thin finger blades — friction grip (NO kinematic
# attach). Sim2real-deployable variant of pick_plant_out_of_vial.
#
# The Zimmer industrial gripper replaces the brittle thin-tweezer:
#   - Long inertial finger blades (50 mm) reach inside the vial mouth
#   - Narrow 5mm width fits through ~25 mm vial opening when fully open
#   - 80 mm Zimmer body sits ABOVE the vial top (z=0.105) with clearance
#   - 200 N grip force + 12000 N/m PD stiffness should clamp the 4 mm
#     stem reliably (vs the tweezer's <5% friction grip per
#     friction_grip_attempted.md)
#
# Hover height reduced from 0.10 → 0.06 m because the Zimmer body eats
# more of the SCARA's vertical reach budget than the tweezer did. With
# 50 mm fingers + 80 mm body, tcp_z_offset = 0.13 m. Reachable TCP z
# range is [-0.10, 0.10], so max hover above plant (z=0.04) is 6 cm.
#
# To run:
#   ./scripts/oracle.sh   --task pick_plant_out_of_vial_zimmer --num-demos 15

task:
  name: pick_plant_out_of_vial_zimmer
  instruction: pick the plant out of the vial and lift it up
  gym_id: Isaac-PickPlantOutOfVialZimmer-T3-IK-Rel-v0
  mimic_gym_id: Isaac-PickPlantOutOfVialZimmer-T3-IK-Rel-Mimic-v0

robot:
  type: t3_401_zimmer
  arm_joints: [joint_1, joint_2, joint_3, joint_4]
  ee_body: tool0_aligned
  tcp_z_offset: 0.16                          # 80mm Zimmer body + 80mm fingers (lengthened tip to reach into the vial)
  arm_joint_jitter_std: 0.003                 # lowered 0.01->0.005->0.003 for a
                                              # cleaner in-vial grasp: jitter
                                              # wobbles the jaws into the stem
                                              # during descent. Lower = the jaws
                                              # stay centred -> more reliable grasp.
  gripper_joints: [finger_left_joint, finger_right_joint]
  gripper_open_m: 0.0                         # joint at 0 = fully open (10mm gap)
  # Close to GRIP the ~8mm stem, not slam shut. The stem-cylinder collision
  # blocks the fingers at joint~0.001 (8mm gap); commanding 0.002 gives a firm
  # ~80N grip. Full close (0.010 = 500N) squeezed the round stem OUT from
  # between the flat faces (ejection — verified in the grasp trajectory: plant
  # lifted 2.5cm then squirted out as the gap went to -0.010). This is what a
  # real force-controlled gripper does — close to grip force, not to a stop.
  gripper_close_m: 0.006                      # firmer (was 0.003): firmer HURT with FLAT jaws (ejected the stem), but the V-groove now holds it laterally, so more grip force = more friction to fight the lift-slip without ejection
  gripper_closed_threshold: 0.0015            # below the ~0.002 gripped pos (6mm stem) so the grasp registers as "closed"
  gripper_driver_joint: finger_left_joint
  # SCARA Jacobian is SINGULAR at the all-zeros home pose: the first row
  # (X-velocity) is all zero so DLS IK can't generate X motion until a
  # perturbation breaks the symmetry. With plant at (0.31, -0.01) — very
  # close to the arm's symmetry axis — this caused 88% HOVER failures in
  # the first oracle smoke test (TCP stuck at home, never converging).
  # The init_joint_pos below spawns the arm in the elbow-down IK solution
  # for (0.31, -0.01), which is well off the singular config so the IK
  # converges cleanly from step 1. Computed by 2-link SCARA IK:
  #   j2 = -acos((r² - L1² - L2²)/(2*L1*L2)) = -1.381 rad
  #   j1 = atan2(y,x) - atan2(L2 sin(j2), L1+L2 cos(j2)) = 0.554 rad
  # j3 is set to give some slack from the upper limit (j3=0) so position-
  # noise jitter doesn't push it out of range.
  init_joint_pos:
    joint_1: 0.554
    joint_2: -1.381
    joint_3: 0.02   # small slack from the j3=0 upper limit so jitter stays in range; TCP hovers above the grasp, wrist cam ~160mm higher looks down on the now-visible green plant top
    joint_4: 0.0
  # Friction grip — NO kinematic_attach shortcut. This is the real-robot-
  # deployable variant. The Zimmer's high grip force + long-finger inertia
  # should hold the stem via friction; if it fails we can add V-groove
  # collision blocks to the fingertips.
  use_kinematic_attach: false

objects:
  # Vial sits on the table; collision disabled (cosmetic) so the plant
  # rests directly on the table at z=0.04.
  vial:
    role: distractor
    type: usd
    usd_path: local:assets/wide_vial/wide_vial.usd
    # Real vial = 7cm tall (fixed manufacturer part — keep at full height). It
    # sits on the table (spawn z=0 → rim at 70mm). The PLANT is sized to match
    # so its stem+foliage clear the rim and the wrist cam can SEE it (2026-05-26:
    # with the plant recessed 57mm below the rim the wrist cam saw only grey rim
    # → vision PPO stuck at 8%).
    scale: [1.0, 1.0, 1.0]
    kinematic: true
    collision: true    # enable the hollow-well collision (the fixture that holds the plant)
    # Fixed + co-located with the plant for the first in-vial test: plant
    # stands at the vial centre so the centred gripper can reach it. (Add
    # co-spawn jitter later once the grasp mechanism is reliable.)
    spawn:
      x: [0.31, 0.31]
      y: [-0.01, -0.01]
      z: [0.035, 0.035]   # proven recessed-grasp config (rim ~105mm) — the wrist-cam-visible tall plant was ungraspable (1.56%), so we keep the recessed plant + use the fixed table_cam for vision
      yaw: [0.0, 0.0]
  plant:
    role: pickable
    type: usd
    # PLANT ASSET CHOICE — finding 2026-05-25. A COMPLIANT jointed plant was
    # fully built (assets/leaf_plant_compliant + the articulated/spring support
    # in convert_cad_assets.py + env_cfg) to model real leaf/stem flex. But in
    # THIS sim the marginal friction grip cannot tolerate ANY added plant
    # compliance, measured directly:
    #   - rigid single body ............... 38-62%  (the working vehicle)
    #   - spring AT the grasp ............. 14%  (stem folds under the jaws,
    #                                            joint hit 2 rad, jaws slide off)
    #   - compliance above + leaf collider  8%  (collider blocks the 80mm
    #                                            reach-in fingers en route to
    #                                            the recessed stem)
    #   - compliance above + visual leaves 12%  (floppy leaf MASS swings the
    #                                            stem out of the grip on lift)
    # Rigid position-controlled jaws + a marginal friction grip + plant
    # compliance are fundamentally at odds here (a real FORCE-controlled,
    # compliant-pad gripper would behave differently — but the Zimmer is kept
    # at manufacturer spec). So the deployable vehicle is the RIGID plant with
    # the leaf MESH visual: it IS a plant (looks right to the camera), grasps
    # reliably; it just doesn't physically sway in sim (documented sim limit;
    # the real plant will). To revisit compliance later: usd_path ->
    # leaf_plant_compliant, add `articulated: true` + a `spring:` block,
    # scale [1,1,1] (see git history).
    usd_path: local:assets/leaf_plant/leaf_plant.usd
    # z-squash to ~48mm: SHORTER than the vial so it sits recessed + graspable
    # (proven ~80% state PPO / 40% oracle). The tall un-squashed plant was wrist-
    # cam-visible but ungraspable (lever-arm lift-slip, 1.56% — see
    # vision_plant_renders_grey memory), so we keep the recessed plant and use
    # the fixed table_cam (which sees the vial) for the deployable vision policy.
    scale: [1.0, 1.0, 0.6]
    friction:
      static: 3.0
      dynamic: 2.5
      restitution: 0.0
    # Spawn xy matches the vial xy so the plant lands inside / right next
    # to wherever the vial settles. yaw randomization disabled because
    # the leaf orientation doesn't matter — only the stem position does.
    spawn:
      # +-1.5cm spawn DR for the VISION policy: the plant (and the vial, via
      # the randomize_plant_and_vial_together co-spawn event) move together
      # around the workspace, so the wrist-cam actor must LOCALIZE the plant
      # rather than memorize a fixed approach. (For BC demo collection this was
      # tightened to fixed; RL doesn't need centred demos, so DR is on.)
      x: [0.30, 0.32]
      y: [-0.02, 0.0]
      # Spawn at the table rest height. The vial is cosmetic (no real
      # support), so a z=0.10 spawn free-fell ~10cm to the table every
      # episode — which (a) broke the lift metric (z0 captured pre-settle
      # ~0.10 made the +0.10 lift threshold need z>=0.20, unreachable) and
      # (b) disturbed the grasp. Spawning at rest removes both.
      z: [0.0, 0.0]
      yaw: [-0.2, 0.2]
  tray:
    role: target
    type: cuboid
    size: [0.02, 0.02, 0.001]
    mass: 0.001
    color: [0.30, 0.40, 0.55]
    kinematic: true
    friction:
      static: 1.0
      dynamic: 0.8
      restitution: 0.0
    spawn:
      x: [0.10, 0.10]
      y: [0.30, 0.30]
      z: [0.0005, 0.0005]
      yaw: [0.0, 0.0]

# Feed the fixed workcell table_cam (not the wrist cam) to the vision PPO. The
# wrist cam can't see the recessed plant, and a wrist-cam-visible tall plant is
# ungraspable (1.56% — see vision_plant_renders_grey memory). The table_cam sees
# the green plant + vial for localization; the recessed plant grasps reliably.
# A fixed workcell camera is still sim2real-deployable.
vision_camera: table_cam

cameras:
  table_cam:
    # Moved CLOSER along the same view ray (was [1.0,0,0.8], ~1.1m away) to
    # ~0.4m from the vial — same viewing angle (rot unchanged), but a tight
    # crop around the vial instead of the whole workcell. That cuts the
    # objects-in-frustum (floor, arm base/links) → far fewer per-view culling
    # descriptors, so the fixed cam fits many envs (the wide view exhausted the
    # RTX descriptor pool even at 128 — see vision_plant_renders_grey memory).
    # Also gives a bigger, clearer vial/green-plant for localization.
    pos: [0.58, 0.0, 0.35]
    rot: [0.35355, -0.61237, -0.61237, 0.35355]
    focal_length: 18.0
    horizontal_aperture: 20.955
    clipping_range: [0.1, 4.0]
    depth: true    # RGBD (4-ch) for the vision CNN — matches the channel count the wrist-cam path used
    tiled: true    # TiledCamera (1 tiled viewport for all envs) — this is the vision-RL camera now, so it must tile or the per-env CameraCfg exhausts the RTX descriptor pool at scale
  wrist_cam:
    parent: tool0_aligned
    # Offset 8cm (vs put_plant_back's 5cm) because the Zimmer body is
    # wider than the tweezer (3.5cm in +X from origin vs ~0.5cm for the
    # tweezer). 5cm offset put the camera right next to the body and
    # the body occluded the workspace below the gripper. 8cm clears the
    # body's +X extent (3.5cm) with 4.5cm of margin, so the camera can
    # see the plant directly through its FOV cone.
    pos: [0.08, 0.0, 0.0]
    rot: [1.0, 0.0, 0.0, 0.0]
    focal_length: 14.0
    horizontal_aperture: 20.955
    clipping_range: [0.01, 2.0]
    depth: true

success:
  type: object_on_target
  object: plant
  target: tray
  xy_threshold: 0.05
  height_threshold: 0.10
grasp_check:
  type: object_grasped
  object: plant
  diff_threshold: 0.04

# --- RL rewards (PPO) -------------------------------------------------------
# Ported from pick_plant_out_of_vial.yaml's v8-tuned block (the run that
# reached 98% on the analogous task). Weights carried over verbatim because
# the reward STRUCTURE (dense approach → grasp_bonus → lift-hold progress →
# terminal stable-lift) is task-agnostic; only lift_height is geometry-
# specific and already matches the Zimmer's oracle lift_height (0.10).
# NOTE: this task is friction grip (use_kinematic_attach: false), which is
# HARDER for PPO than the kin_attach task these weights were tuned on —
# expect to iterate the approach/grasp balance if the reward curve stalls.
rewards:
  approach_pickable: 5.0         # dense; CNN actor has no privileged plant
                                 # pose, so a weak (1.0) signal lets PPO
                                 # collapse action_std to the do-nothing min.
  approach_target: 0.0           # transport is scripted, not RL-learned
  grasp_bonus: 1.0               # +1/step when gripper closed AND TCP <3cm
                                 # of plant (camping-safe at this weight)
  lift_bonus: 10.0               # per-step lift_hold progress; makes a held
                                 # lift clearly beat camping at the grasp zone
  lift_shaping: 5.0              # DENSE partial-lift reward (∝ plant height,
                                 # gated on grasp). Bridges grasp→lift: the
                                 # binary lift_bonus never fires under friction
                                 # grip (slipping partial lifts), so v1 stalled
                                 # at 0% with lift_bonus=0. This pays out the
                                 # instant the plant rises at all. Below
                                 # lift_bonus so a full stable hold still wins.
  success_bonus: 1000.0          # one-shot terminal bonus on stable lift
  action_l2_penalty: -0.0001     # small; don't drown the approach signal
  lift_height: 0.030             # FIXED (was 0.10 — UNREACHABLE: oracle's best lift
                                 # was +0.08, plant maxes ~0.05, so success read 0
                                 # as a metric artifact). 0.030 = a clear stable
                                 # lift-OUT of the vial, matching the oracle's
                                 # honest z>=0.020 criterion. Reachable.
  lift_stable_steps: 5           # consecutive steps above threshold = success
  success_termination: lifted    # episode ends on grasp + stable lift

# Scripted oracle. Hover height REDUCED from 0.10 → 0.06 because the
# Zimmer body cuts the SCARA's effective vertical workspace. See URDF
# comment for the reach budget math.
oracle:
  # In-vial grasp (long 80mm tip, ~47mm plant in 70mm vial well). Heights kept
  # within the SCARA's reduced TCP reach (~0.07 with the long tip): hover just
  # above the plant top, grasp mid-upper, lift as high as the arm can (the
  # 70mm vial is near the reach ceiling — if lift-out fails here, the vial
  # needs to be shorter, which is the kinematics finding).
  hover_height: 0.05
  grasp_z_offset: 0.035
  lift_height: 0.07                           # the long-tip TCP ceiling (max upward reach)
  place_z_offset: 0.0
  max_dxy: 0.04
  max_dz: 0.02
  xy_reach_tol: 0.008                         # back to 38% config; tightening to
                                              # 0.003 didn't help capture (28%)
                                              # -> remaining variance is friction
                                              # non-determinism, not alignment.
  z_reach_tol: 0.020                          # bumped from 0.015 for the
                                              # same reason
  z_reach_tol_tight: 0.012
  grasp_hold_steps: 18
  release_hold_steps: 5
  max_steps_per_episode: 400                  # 400 is plenty — diagnostic
                                              # (2026-05-24) showed ~85% oracle
                                              # success, all failures in approach
                                              # phases (IK timeouts under spawn
                                              # DR), zero at GRASP/LIFT. Bumping
                                              # to 600 didn't help (noise). The
                                              # oracle rate doesn't bottleneck
                                              # the pipeline — demos collect to
                                              # target regardless.
  max_episode_attempts_per_demo: 5
  terminate_after_lift: true

mimic:
  name: pick_plant_out_of_vial_zimmer_mimic_D0
  generation_num_trials: 10
  max_num_failures: 25
  seed: 1
  subtasks:
    - object: plant
      signal: grasp
      offset_range: [10, 20]
      action_noise: 0.03
      num_interpolation_steps: 5
      description: Grasp the plant in the vial
      next_description: Place the plant on the tray
    - object: tray
      signal: null
      offset_range: [0, 0]
      action_noise: 0.03
      num_interpolation_steps: 5
      description: Place the plant on the tray

data:
  raw_path: data/raw/pick_plant_out_of_vial_zimmer/demos.hdf5
  annotated_path: data/annotated/pick_plant_out_of_vial_zimmer/demos.hdf5
  augmented_path: data/augmented/pick_plant_out_of_vial_zimmer/demos.hdf5
  hdf5_path: data/raw/pick_plant_out_of_vial_zimmer/demos.hdf5

training:
  output_dir: checkpoints/pick_plant_out_of_vial_zimmer
  save_every: 2000        # fixed-spawn task converges fast (loss 0.6->0.16 by step 350); checkpoint often so we can eval early + stop

eval:
  checkpoint: checkpoints/pick_plant_out_of_vial_zimmer/final
